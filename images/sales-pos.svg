<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00FFB3"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 212, 255, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <!-- Glows -->
  <circle cx="620" cy="160" r="160" fill="rgba(0, 255, 179, 0.12)" filter="blur(50px)"/>
  <circle cx="180" cy="300" r="150" fill="rgba(108, 99, 255, 0.15)" filter="blur(40px)"/>

  <!-- POS Window Frame -->
  <rect x="60" y="45" width="680" height="360" rx="18" fill="rgba(17, 27, 49, 0.82)" stroke="rgba(0, 212, 255, 0.35)" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="60" y="45" width="680" height="46" rx="18" fill="rgba(255, 255, 255, 0.04)"/>
  <circle cx="90" cy="68" r="6" fill="#ff5f56"/>
  <circle cx="110" cy="68" r="6" fill="#ffbd2e"/>
  <circle cx="130" cy="68" r="6" fill="#27c93f"/>
  <text x="160" y="73" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13">SalesPOS Enterprise — WinForms POS & Inventory ERP</text>

  <!-- Left: Checkout & Barcode Scanner Panel -->
  <rect x="95" y="115" width="310" height="210" rx="12" fill="rgba(11, 18, 33, 0.9)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="115" y="145" fill="#00D4FF" font-family="'Syne', sans-serif" font-weight="bold" font-size="16">POS Register & Barcode Verification</text>
  
  <!-- Simulated Barcode Graphic -->
  <g transform="translate(115, 165)">
    <rect x="0" y="0" width="4" height="36" fill="#E2E8F0"/>
    <rect x="7" y="0" width="8" height="36" fill="#E2E8F0"/>
    <rect x="18" y="0" width="3" height="36" fill="#E2E8F0"/>
    <rect x="25" y="0" width="10" height="36" fill="#E2E8F0"/>
    <rect x="38" y="0" width="5" height="36" fill="#E2E8F0"/>
    <rect x="47" y="0" width="7" height="36" fill="#E2E8F0"/>
    <rect x="58" y="0" width="4" height="36" fill="#E2E8F0"/>
    <rect x="66" y="0" width="9" height="36" fill="#E2E8F0"/>
    <rect x="79" y="0" width="3" height="36" fill="#E2E8F0"/>
    <rect x="86" y="0" width="7" height="36" fill="#E2E8F0"/>
    <rect x="96" y="0" width="5" height="36" fill="#E2E8F0"/>
    <rect x="105" y="0" width="8" height="36" fill="#E2E8F0"/>
    <rect x="117" y="0" width="4" height="36" fill="#E2E8F0"/>
    <text x="60" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">ZXing EAN-13 Scanned</text>
  </g>

  <!-- Cart Items List Simulation -->
  <g transform="translate(115, 235)">
    <text x="0" y="15" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11">INV-9842 • 14 Line Items</text>
    <text x="0" y="35" fill="#00FFB3" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">Total: $8,420.50 (Gross Profit: 34%)</text>
    <text x="0" y="55" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Customer Center: Approved • Credit Memos Validated</text>
  </g>

  <!-- Right: QuickBooks Accounting Sync Panel -->
  <rect x="430" y="115" width="280" height="210" rx="12" fill="rgba(11, 18, 33, 0.9)" stroke="rgba(0, 255, 179, 0.35)" stroke-width="1"/>
  <text x="450" y="145" fill="#00FFB3" font-family="'Syne', sans-serif" font-weight="bold" font-size="16">QuickBooks Accounting Sync</text>
  
  <rect x="450" y="165" width="240" height="42" rx="8" fill="rgba(0, 255, 179, 0.08)" stroke="rgba(0, 255, 179, 0.25)"/>
  <text x="465" y="190" fill="#00FFB3" font-family="'JetBrains Mono', monospace" font-size="12">✓ Real-time Journal Entry Synced</text>
  
  <text x="450" y="235" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">● Automated General Ledger Mapping</text>
  <text x="450" y="255" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">● Crystal Reports Invoice Generation</text>
  <text x="450" y="275" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">● Shipping, Returns & Refund Auditing</text>

  <!-- Bottom Badges -->
  <g transform="translate(95, 345)">
    <rect x="0" y="0" width="120" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="60" y="20" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">C# .NET WinForms</text>

    <rect x="135" y="0" width="135" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="202" y="20" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SQL Server Stored Procs</text>

    <rect x="285" y="0" width="155" height="30" rx="8" fill="rgba(0, 255, 179, 0.1)" stroke="rgba(0, 255, 179, 0.3)"/>
    <text x="362" y="20" fill="#00FFB3" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">QuickBooks API Sync</text>

    <rect x="455" y="0" width="155" height="30" rx="8" fill="rgba(0, 212, 255, 0.1)" stroke="rgba(0, 212, 255, 0.3)"/>
    <text x="532" y="20" fill="#00D4FF" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Barcode Verification</text>
  </g>
</svg>
