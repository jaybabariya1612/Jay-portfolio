<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d172e"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(108, 99, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="180" r="140" fill="rgba(108, 99, 255, 0.15)" filter="blur(40px)"/>
  <circle cx="600" cy="260" r="160" fill="rgba(0, 212, 255, 0.12)" filter="blur(50px)"/>

  <!-- Central Card -->
  <rect x="60" y="50" width="680" height="350" rx="20" fill="rgba(17, 26, 51, 0.75)" stroke="rgba(108, 99, 255, 0.3)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="60" y="50" width="680" height="46" rx="20" fill="rgba(255, 255, 255, 0.04)"/>
  <circle cx="90" cy="73" r="6" fill="#ff5f56"/>
  <circle cx="110" cy="73" r="6" fill="#ffbd2e"/>
  <circle cx="130" cy="73" r="6" fill="#27c93f"/>
  <text x="160" y="78" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13">TxPartsSync.Service.exe — [Continuous Sync Daemon: ACTIVE]</text>

  <!-- Sync Visualization Graphic -->
  <!-- Left Side: POS System -->
  <rect x="100" y="140" width="220" height="150" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1.5"/>
  <text x="120" y="175" fill="#00D4FF" font-family="'Syne', sans-serif" font-weight="bold" font-size="18">Retail POS</text>
  <text x="120" y="200" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">SQL Server • Local DB</text>
  <rect x="120" y="220" width="180" height="26" rx="6" fill="rgba(0, 255, 179, 0.1)" stroke="rgba(0, 255, 179, 0.3)"/>
  <text x="135" y="238" fill="#00FFB3" font-family="'JetBrains Mono', monospace" font-size="11">● Locked Interval: 10m</text>
  <text x="120" y="272" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">Orders • Memos • Items</text>

  <!-- Center: Bidirectional Sync Animation -->
  <g transform="translate(365, 185)">
    <circle cx="35" cy="30" r="38" fill="rgba(108, 99, 255, 0.2)" stroke="url(#primaryGrad)" stroke-width="2"/>
    <!-- Sync Arrows Icon -->
    <path d="M 22 24 C 24 16, 46 16, 48 24 L 54 18 M 48 36 C 46 44, 24 44, 22 36 L 16 42" fill="none" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
    <text x="-10" y="85" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Auto-Retry Sync</text>
  </g>

  <!-- Right Side: Cloud API -->
  <rect x="480" y="140" width="220" height="150" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(108, 99, 255, 0.4)" stroke-width="1.5"/>
  <text x="500" y="175" fill="#6C63FF" font-family="'Syne', sans-serif" font-weight="bold" font-size="18">TxParts Cloud API</text>
  <text x="500" y="200" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">REST Endpoints • JSON</text>
  <rect x="500" y="220" width="180" height="26" rx="6" fill="rgba(108, 99, 255, 0.12)" stroke="rgba(108, 99, 255, 0.3)"/>
  <text x="515" y="238" fill="#6C63FF" font-family="'JetBrains Mono', monospace" font-size="11">✓ Token Authenticated</text>
  <text x="500" y="272" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">Barcode & Crystal Reports</text>

  <!-- Bottom Pills -->
  <g transform="translate(100, 330)">
    <rect x="0" y="0" width="135" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="67" y="20" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">.NET Windows Service</text>

    <rect x="150" y="0" width="120" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="210" y="20" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">ZXing Barcode</text>

    <rect x="285" y="0" width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="350" y="20" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Crystal Reports</text>

    <rect x="430" y="0" width="170" height="30" rx="8" fill="rgba(0, 255, 179, 0.08)" stroke="rgba(0, 255, 179, 0.3)"/>
    <text x="515" y="20" fill="#00FFB3" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">High Reliability / Concurrency</text>
  </g>
</svg>
